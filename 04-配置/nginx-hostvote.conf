# /etc/nginx/conf.d/hostvote.conf
# 2026 主持人大赛投票系统 —— 反向代理：同时监听 80 与 8080，指向同一应用
# 两个端口访问到的是同一套系统与同一份数据。

upstream hostvote_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    listen      8080;
    listen      [::]:8080;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;      # 选手照片上传
    client_body_timeout  60s;

    access_log /var/log/nginx/hostvote-access.log;
    error_log  /var/log/nginx/hostvote-error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态资源（CSS/JS）可缓存；上传的选手照片也走这里
    location /assets/ {
        proxy_pass http://hostvote_app;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /uploads/ {
        proxy_pass http://hostvote_app;
        proxy_set_header Host $host;
        expires 12h;
        add_header Cache-Control "public";
    }

    location = /healthz {
        proxy_pass http://hostvote_app;
        access_log off;
    }

    location / {
        proxy_pass http://hostvote_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering off;       # 便于实时看到计数/导出进度
    }
}
